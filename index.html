<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrezMaker | Decathlon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        decaBlue: '#3B49B8',
                        decaBlueDark: '#2A3485',
                        decaGreen: '#6EF0A0',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-decaBlueDark min-h-screen flex items-center justify-center p-4 text-white overflow-hidden">

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center px-6 py-4 rounded-xl shadow-2xl backdrop-blur-md">
        <span id="toastIcon" class="mr-3 text-2xl"></span>
        <p id="toastMessage" class="font-semibold text-sm"></p>
    </div>

    <div class="bg-decaBlue bg-opacity-90 backdrop-blur-lg w-full max-w-md rounded-3xl shadow-2xl p-8 relative border border-white border-opacity-10">
        
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-white opacity-5 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-decaGreen opacity-10 rounded-full blur-2xl"></div>

        <div class="text-center mb-6 relative z-10">
            <h1 class="text-3xl font-bold tracking-tight mb-1">Prez<span class="text-decaGreen">Maker</span></h1>
            <p class="text-blue-200 text-sm font-semibold">Générateur expert alimenté par Gemini.</p>
        </div>

        <form id="uploadForm" class="space-y-5 relative z-10">
            
            <!-- PPTX Drag & Drop -->
            <div id="dropZone" class="relative flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-blue-300 border-opacity-40 rounded-2xl bg-decaBlueDark bg-opacity-40 hover:border-decaGreen transition-all cursor-pointer overflow-hidden">
                <div id="dropStateInitial" class="flex flex-col items-center pointer-events-none">
                    <svg class="w-8 h-8 text-decaGreen mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="text-sm font-semibold">Fichier PPTX à formater</p>
                </div>
                <div id="dropStateSelected" class="hidden flex flex-col items-center w-full px-6 text-center pointer-events-none">
                    <p id="fileName" class="text-sm font-bold text-decaGreen truncate w-full"></p>
                </div>
                <input type="file" id="fileUpload" accept=".pptx" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            </div>

            <!-- Gemini IA Section -->
            <div class="border-t border-white border-opacity-10 pt-4 space-y-3">
                <p class="text-xs font-bold text-decaGreen uppercase tracking-wider flex items-center">
                    Générer une image avec vos données
                </p>
                
                <textarea id="imagePrompt" rows="2" placeholder="Ex: Un graphique montrant la progression des ventes..." class="w-full p-3 rounded-xl bg-decaBlueDark border border-blue-400 border-opacity-30 text-white text-sm focus:outline-none focus:border-decaGreen transition placeholder-blue-300 resize-none"></textarea>
                
                <!-- Input de Données (CSV/TXT) -->
                <div class="relative overflow-hidden w-full">
                    <input type="file" id="dataFile" accept=".csv,.txt,.json" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="flex items-center justify-between w-full p-3 rounded-xl bg-decaBlueDark border border-blue-400 border-opacity-30 text-sm">
                        <span id="dataFileName" class="text-blue-300">Joindre un contexte (CSV, TXT)...</span>
                        <svg class="w-5 h-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-decaGreen text-decaBlueDark font-bold py-4 rounded-xl shadow-[0_4px_14px_rgba(110,240,160,0.39)] hover:bg-white transition-all flex justify-center items-center">
                <span id="btnText">Traiter la présentation</span>
                <svg id="btnLoader" class="animate-spin h-5 w-5 ml-3 hidden text-decaBlueDark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('fileUpload');
        const dataFileInput = document.getElementById('dataFile');
        
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                document.getElementById('dropStateInitial').classList.add('hidden');
                document.getElementById('dropStateSelected').classList.remove('hidden');
                document.getElementById('fileName').textContent = e.target.files[0].name;
            }
        });

        dataFileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                document.getElementById('dataFileName').textContent = e.target.files[0].name;
                document.getElementById('dataFileName').classList.add('text-decaGreen', 'font-semibold');
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.className = `fixed bottom-5 right-5 transform transition-all duration-300 z-50 flex items-center px-6 py-4 rounded-xl shadow-2xl backdrop-blur-md ${type === 'success' ? 'bg-decaGreen text-decaBlueDark' : 'bg-red-500 text-white'}`;
            document.getElementById('toastIcon').innerHTML = type === 'success' ? '✨' : '⚠️';
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 4000);
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            document.getElementById('btnText').textContent = "Analyse en cours...";
            document.getElementById('btnLoader').classList.remove('hidden');

            const formData = new FormData();
            formData.append('fichier', fileInput.files[0]);
            
            const prompt = document.getElementById('imagePrompt').value;
            if (prompt) formData.append('image_prompt', prompt);
            
            // Ajout du fichier de données (s'il existe)
            if (dataFileInput.files.length > 0) {
                formData.append('donnees', dataFileInput.files[0]);
            }

            try {
                const response = await fetch('/api/appliquer-charte', { method: 'POST', body: formData });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `PrezMaker_${fileInput.files[0].name}`;
                    document.body.appendChild(a); 
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    showToast("Transformation réussie !", "success");
                } else {
                    showToast("Erreur lors de la transformation.", "error");
                }
            } catch (error) {
                showToast("Erreur de connexion.", "error");
            } finally {
                submitBtn.disabled = false;
                document.getElementById('btnText').textContent = "Traiter la présentation";
                document.getElementById('btnLoader').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
