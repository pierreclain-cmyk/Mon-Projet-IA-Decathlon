<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formateur de Présentation Decathlon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg border-t-4 border-[#3B49B8]">
        <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">Mise à la charte automatique</h1>
        <p class="text-gray-500 text-sm text-center mb-6">Uploadez une ancienne présentation, nous appliquons les couleurs Decathlon.</p>
        
        <form id="uploadForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700">Fichier PowerPoint (.pptx)</label>
                <input type="file" id="fileUpload" accept=".pptx" required class="w-full mt-1 p-2 border rounded-lg">
            </div>

            <button type="submit" class="w-full bg-[#3B49B8] text-white font-bold py-3 rounded-lg hover:bg-blue-800 transition duration-200">
                Transformer le fichier
            </button>
        </form>

        <div id="status" class="mt-4 text-center text-sm font-medium text-gray-600 hidden">
            Transformation en cours...
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = document.getElementById('fileUpload').files[0];
            const statusDiv = document.getElementById('status');
            const btn = e.target.querySelector('button');
            
            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = "Transformation en cours...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('fichier', file);

            try {
                const response = await fetch('/api/appliquer-charte', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "Decathlon_Modifie.pptx";
                    
                    // --- LA CORRECTION EST ICI ---
                    // Il est OBLIGATOIRE d'ajouter le lien au document pour que le clic fonctionne
                    document.body.appendChild(a); 
                    a.click();
                    
                    // On nettoie la page une fois le téléchargement lancé
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    
                    statusDiv.innerHTML = "<span class='text-green-600 font-bold'>Téléchargement réussi !</span>";
                } else {
                    statusDiv.innerHTML = "<span class='text-red-500'>Erreur lors de la transformation.</span>";
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "<span class='text-red-500'>Erreur de connexion au serveur.</span>";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
